<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="250" viewBox="0 0 1280 250" role="img" aria-labelledby="t d"><title id="t">How INFUSE works</title><desc id="d">Four steps: load, edit, preview with AI, export.</desc><rect width="1280" height="250" rx="24" fill="#0a0a0f"/><rect x="1" y="1" width="1278" height="248" rx="23" fill="none" stroke="#ffffff" stroke-opacity=".1"/><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#8892a4"/></marker></defs><rect x="36" y="50" width="268" height="150" rx="16" fill="#12121a" stroke="#ff7a1a" stroke-opacity=".55"/><text x="58" y="90" font-family="Inter,'Segoe UI',system-ui,-apple-system,sans-serif" font-size="20" font-weight="700" fill="#eef0f8">1  Load</text><text x="58" y="120" font-family="Inter,'Segoe UI',system-ui,-apple-system,sans-serif" font-size="15" fill="#8892a4">Drop an .html file,</text><text x="58" y="144" font-family="Inter,'Segoe UI',system-ui,-apple-system,sans-serif" font-size="15" fill="#8892a4">paste a URL, or queue</text><text x="58" y="168" font-family="Inter,'Segoe UI',system-ui,-apple-system,sans-serif" font-size="15" fill="#8892a4">several files</text><line x1="308" y1="125" x2="340" y2="125" stroke="#8892a4" stroke-width="2" marker-end="url(#a)"/><rect x="344" y="50" width="268" height="150" rx="16" fill="#12121a" stroke="#4fd8f0" stroke-opacity=".55"/><text x="366" y="90" font-family="Inter,'Segoe UI',system-ui,-apple-system,sans-serif" font-size="20" font-weight="700" fill="#eef0f8">2  Edit</text><text x="366" y="120" font-family="Inter,'Segoe UI',system-ui,-apple-system,sans-serif" font-size="15" fill="#8892a4">Every heading, paragraph,</text><text x="366" y="144" font-family="Inter,'Segoe UI',system-ui,-apple-system,sans-serif" font-size="15" fill="#8892a4">link and image is</text><text x="366" y="168" font-family="Inter,'Segoe UI',system-ui,-apple-system,sans-serif" font-size="15" fill="#8892a4">an editable card</text><line x1="616" y1="125" x2="648" y2="125" stroke="#8892a4" stroke-width="2" marker-end="url(#a)"/><rect x="652" y="50" width="268" height="150" rx="16" fill="#12121a" stroke="#ff7a1a" stroke-opacity=".55"/><text x="674" y="90" font-family="Inter,'Segoe UI',system-ui,-apple-system,sans-serif" font-size="20" font-weight="700" fill="#eef0f8">3  Preview + AI</text><text x="674" y="120" font-family="Inter,'Segoe UI',system-ui,-apple-system,sans-serif" font-size="15" fill="#8892a4">Live preview, Groq rewrites,</text><text x="674" y="144" font-family="Inter,'Segoe UI',system-ui,-apple-system,sans-serif" font-size="15" fill="#8892a4">deep scan for hidden</text><text x="674" y="168" font-family="Inter,'Segoe UI',system-ui,-apple-system,sans-serif" font-size="15" fill="#8892a4">CSS background images</text><line x1="924" y1="125" x2="956" y2="125" stroke="#8892a4" stroke-width="2" marker-end="url(#a)"/><rect x="960" y="50" width="268" height="150" rx="16" fill="#12121a" stroke="#4fd8f0" stroke-opacity=".55"/><text x="982" y="90" font-family="Inter,'Segoe UI',system-ui,-apple-system,sans-serif" font-size="20" font-weight="700" fill="#eef0f8">4  Export</text><text x="982" y="120" font-family="Inter,'Segoe UI',system-ui,-apple-system,sans-serif" font-size="15" fill="#8892a4">Download a clean</text><text x="982" y="144" font-family="Inter,'Segoe UI',system-ui,-apple-system,sans-serif" font-size="15" fill="#8892a4">.edited.html with all</text><text x="982" y="168" font-family="Inter,'Segoe UI',system-ui,-apple-system,sans-serif" font-size="15" fill="#8892a4">changes baked in</text></svg>
