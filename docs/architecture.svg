<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="440" viewBox="0 0 1280 440" role="img" aria-labelledby="t d"><title id="t">INFUSE architecture</title><desc id="d">Everything runs in the browser. Only Groq, an optional page-fetch proxy and Google Fonts are contacted.</desc><rect width="1280" height="440" rx="24" fill="#0a0a0f"/><rect x="1" y="1" width="1278" height="438" rx="23" fill="none" stroke="#ffffff" stroke-opacity=".1"/><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#8892a4"/></marker></defs><rect x="36" y="36" width="720" height="368" rx="20" fill="none" stroke="#ff7a1a" stroke-opacity=".5" stroke-dasharray="2 6"/><text x="60" y="68" font-family="'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" letter-spacing="2" fill="#ff7a1a">YOUR BROWSER</text><rect x="64" y="96" width="200" height="76" rx="14" fill="#12121a" stroke="#4fd8f0" stroke-opacity=".7"/><text x="164.0" y="130.0" text-anchor="middle" font-family="Inter,'Segoe UI',system-ui,-apple-system,sans-serif" font-size="17" font-weight="700" fill="#eef0f8">app/index.html</text><text x="164.0" y="152.0" text-anchor="middle" font-family="'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#8892a4">editor · audit · deploy</text><rect x="300" y="96" width="200" height="76" rx="14" fill="#12121a" stroke="#4fd8f0" stroke-opacity=".7"/><text x="400.0" y="130.0" text-anchor="middle" font-family="Inter,'Segoe UI',system-ui,-apple-system,sans-serif" font-size="17" font-weight="700" fill="#eef0f8">DOM parser</text><text x="400.0" y="152.0" text-anchor="middle" font-family="'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#8892a4">fields from HTML</text><rect x="536" y="96" width="196" height="76" rx="14" fill="#12121a" stroke="#4fd8f0" stroke-opacity=".7"/><text x="634.0" y="130.0" text-anchor="middle" font-family="Inter,'Segoe UI',system-ui,-apple-system,sans-serif" font-size="17" font-weight="700" fill="#eef0f8">URL loader</text><text x="634.0" y="152.0" text-anchor="middle" font-family="'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#8892a4">local helper, then proxy</text><rect x="64" y="226" width="200" height="76" rx="14" fill="#12121a" stroke="#ff7a1a" stroke-opacity=".7"/><text x="164.0" y="260.0" text-anchor="middle" font-family="Inter,'Segoe UI',system-ui,-apple-system,sans-serif" font-size="17" font-weight="700" fill="#eef0f8">localStorage</text><text x="164.0" y="282.0" text-anchor="middle" font-family="'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#8892a4">models · optional key</text><rect x="300" y="226" width="200" height="76" rx="14" fill="#12121a" stroke="#ff7a1a" stroke-opacity=".7"/><text x="400.0" y="260.0" text-anchor="middle" font-family="Inter,'Segoe UI',system-ui,-apple-system,sans-serif" font-size="17" font-weight="700" fill="#eef0f8">Service worker</text><text x="400.0" y="282.0" text-anchor="middle" font-family="'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#8892a4">sw.js · offline shell</text><rect x="536" y="226" width="196" height="76" rx="14" fill="#12121a" stroke="#ff7a1a" stroke-opacity=".7"/><text x="634.0" y="260.0" text-anchor="middle" font-family="Inter,'Segoe UI',system-ui,-apple-system,sans-serif" font-size="17" font-weight="700" fill="#eef0f8">Groq client</text><text x="634.0" y="282.0" text-anchor="middle" font-family="'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#8892a4">chat · scan · themes</text><line x1="264" y1="134" x2="300" y2="134" stroke="#8892a4" stroke-width="2" marker-end="url(#a)"/><line x1="500" y1="134" x2="536" y2="134" stroke="#8892a4" stroke-width="2" marker-end="url(#a)"/><line x1="164" y1="172" x2="164" y2="226" stroke="#8892a4" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#a)"/><text x="64" y="346" font-family="Inter,'Segoe UI',system-ui,-apple-system,sans-serif" font-size="14" fill="#8892a4">Your HTML never leaves the browser except the snippets you send to Groq.</text><text x="64" y="372" font-family="Inter,'Segoe UI',system-ui,-apple-system,sans-serif" font-size="14" fill="#8892a4">No backend, no account, no build step.</text><rect x="880" y="96" width="340" height="76" rx="14" fill="#12121a" stroke="#4fd8f0" stroke-opacity=".7" stroke-dasharray="6 5"/><text x="1050.0" y="130.0" text-anchor="middle" font-family="Inter,'Segoe UI',system-ui,-apple-system,sans-serif" font-size="17" font-weight="700" fill="#eef0f8">corsproxy.io</text><text x="1050.0" y="152.0" text-anchor="middle" font-family="'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#8892a4">optional · asks before each session</text><rect x="880" y="226" width="340" height="76" rx="14" fill="#12121a" stroke="#ff7a1a" stroke-opacity=".7"/><text x="1050.0" y="260.0" text-anchor="middle" font-family="Inter,'Segoe UI',system-ui,-apple-system,sans-serif" font-size="17" font-weight="700" fill="#eef0f8">api.groq.com</text><text x="1050.0" y="282.0" text-anchor="middle" font-family="'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#8892a4">HTTPS · your key in the header</text><rect x="880" y="336" width="340" height="56" rx="14" fill="#12121a" stroke="#4fd8f0" stroke-opacity=".7" stroke-dasharray="6 5"/><text x="1050.0" y="360.0" text-anchor="middle" font-family="Inter,'Segoe UI',system-ui,-apple-system,sans-serif" font-size="17" font-weight="700" fill="#eef0f8">Google Fonts</text><text x="1050.0" y="382.0" text-anchor="middle" font-family="'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#8892a4">loaded at startup</text><line x1="732" y1="134" x2="880" y2="134" stroke="#8892a4" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#a)"/><line x1="732" y1="264" x2="880" y2="264" stroke="#8892a4" stroke-width="2" marker-end="url(#a)"/></svg>
